<section class="relative min-h-screen overflow-hidden">
  <div class="absolute inset-0 bg-[#070A13]"></div>

  <div
    class="absolute inset-0 bg-[radial-gradient(900px_520px_at_20%_15%,rgba(56,189,248,.22),transparent_60%),radial-gradient(900px_520px_at_80%_20%,rgba(236,72,153,.18),transparent_60%),radial-gradient(900px_520px_at_50%_95%,rgba(34,197,94,.14),transparent_62%)]"
  ></div>

  <div
    class="absolute inset-0 opacity-[0.10] bg-[linear-gradient(to_right,rgba(255,255,255,.08)_1px,transparent_1px),linear-gradient(to_bottom,rgba(255,255,255,.08)_1px,transparent_1px)] bg-[size:52px_52px]"
  ></div>

  <div class="floating-layer pointer-events-none absolute inset-0">
    @for (b of bgLetters; track b.id) {
      <span
        class="float-icon"
        [style.left.%]="b.left"
        [style.top.%]="b.top"
        [style.fontSize.px]="b.size"
        [style.animationDuration.s]="b.dur"
        [style.animationDelay.s]="b.delay"
        [style.--c]="b.color"
      >
        {{ b.char }}
      </span>
    }
  </div>

  <div class="relative z-10">
    <app-navbar />
    <div class=" py-18">
      <router-outlet></router-outlet>
    </div>
  </div>
</section>
