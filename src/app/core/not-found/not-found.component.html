<section class="relative h-screen overflow-hidden bg-slate-50 dark:bg-[#070A13] text-slate-900 dark:text-white flex items-center justify-center">
  <div class="pointer-events-none absolute -top-64 -left-72 h-[520px] w-[820px] rounded-[999px] bg-sky-500/20 dark:bg-sky-500/12 blur-[130px]"></div>
  <div class="pointer-events-none absolute -bottom-72 -right-60 h-[720px] w-[720px] rounded-full bg-fuchsia-500/20 dark:bg-fuchsia-500/12 blur-[140px]"></div>

  <div class="relative z-10 w-full max-w-2xl text-center px-4">
    
    <h1 class="text-[8rem] md:text-[14rem] leading-none font-black tracking-tighter text-transparent bg-clip-text bg-gradient-to-r from-sky-400/80 to-fuchsia-400/80 select-none">
      404
    </h1>

    <div class="relative size-72 md:size-80 z-40 mx-auto mt-[-80px] md:mt-[-120px] overflow-hidden drop-shadow-[0_20px_50px_rgba(0,0,0,0.5)]">
      <video
        src="/images/loader/NotFound.webm"
        [autoplay]="true"
        [loop]="true"
        [muted]="true"
        playsinline
        class="w-full h-full object-cover scale-110"
      ></video>
    </div>

    <div class="mt-4 animate-in fade-in slide-in-from-bottom-4 duration-700">
      <h2 class="text-3xl md:text-4xl font-black text-slate-900 dark:text-white tracking-wide">Page Not Found</h2>
      <p class="mt-3 text-slate-600 dark:text-white/60 text-base md:text-lg max-w-md mx-auto font-medium">
        The page you’re looking for doesn’t exist or may have been moved to another universe.
      </p>

      <div class="mt-10 flex justify-center">
        <a
          routerLink="/home"
          class="group relative inline-flex items-center justify-center px-8 py-3.5 font-bold text-slate-800 dark:text-white transition-all duration-300 rounded-2xl bg-white dark:bg-white/5 border border-slate-200 dark:border-white/10 hover:bg-slate-50 dark:hover:bg-white/10 dark:hover:border-sky-500/50 dark:hover:shadow-[0_0_30px_-5px_rgba(56,189,248,0.4)] hover:-translate-y-1 active:translate-y-0"
        >
          <span class="mr-2 group-hover:-translate-x-1 transition-transform"><i class="fa-solid fa-arrow-left"></i></span>
          Go Back Home
        </a>
      </div>
    </div>

  </div>
</section>
