<div class="quiz-wrap" [class.state-correct]="state === 'correct'">
  <div class="overlay" *ngIf="state === 'finished'">
    <div class="result-card">
      <div class="ornament">🏆</div>
      <h2 class="result-title">أحسنت!</h2>
      <p class="result-subtitle">Quiz Complete</p>
      <div class="result-score">
        {{ score }}<span> / {{ TOTAL_ROUNDS }}</span>
      </div>
      <p class="result-pct">{{ Math.round((score / TOTAL_ROUNDS) * 100) }}%</p>
      <button class="btn-restart" (click)="restart()">العب مجدداً</button>
    </div>
  </div>

  <header class="quiz-header">
    <div class="progress-bar">
      <div class="progress-fill" [style.width.%]="progressPercent"></div>
    </div>
    <div class="stats-row">
      <span
        >جولة <strong>{{ round + 1 }}</strong> / {{ TOTAL_ROUNDS }}</span
      >
      <span
        >النتيجة <strong>{{ score }}</strong></span
      >
    </div>
  </header>

  <main class="quiz-main">
    <div class="target-section">
      <p class="target-label">أظهر إشارة الحرف</p>
      <div class="letter-tiles-row">
        <span
          class="letter-tile mb-3"
          [class.done]="state === 'correct'"
          [class.active]="state === 'waiting'"
        >
          {{ currentLetter?.arabic }}
        </span>
      </div>
      <!-- <p class="target-name">{{ currentLetter?.name }}</p> -->
    </div>

    <div class="camera-wrap" [class.glow-correct]="state === 'correct'">
      <video
        #video
        autoplay
        playsinline
        muted
        style="position: absolute; width: 100%; height: 100%; opacity: 0; z-index: -1"
      ></video>
      <canvas #canvas width="640" height="480"></canvas>
      <canvas
        #confettiCanvas
        width="640"
        height="480"
        style="position: absolute; inset: 0; pointer-events: none; z-index: 10"
      ></canvas>
      <div class="prediction-badge">
        <span class="pred-letter">{{ prediction }}</span>
        <span class="pred-conf">{{ confidencePercent }}%</span>
      </div>
      <div class="streak-bar" *ngIf="correctStreak > 0 && state !== 'correct'">
        <div class="streak-fill" [style.width.%]="streakPercent"></div>
      </div>
      <div class="feedback-flash" *ngIf="state === 'correct'">✓ ممتاز!</div>
    </div>

    <div class="controls">
      <button
        class="btn-skip"
        (click)="skipLetter()"
        [disabled]="state === 'correct' || state === 'finished'"
      >
        تخطي
      </button>
    </div>

    <p class="tip" *ngIf="!lastLandmarks.length">ضع يدك أمام الكاميرا</p>
  </main>
</div>
