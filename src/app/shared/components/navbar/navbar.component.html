<header class="fixed top-0 left-0 right-0 z-50">
  <div class="mx-auto max-w-6xl px-4 pt-4">
    <div
      class="relative rounded-[999px] p-[1px] bg-gradient-to-r from-sky-500/40 via-fuchsia-500/30 to-emerald-500/30"
    >
      <div
        class="rounded-[999px] bg-[#070A13]/85 backdrop-blur-xl border border-white/10 shadow-[0_25px_100px_-70px_rgba(0,0,0,.95)]"
      >
        <div class="flex items-center justify-between px-4 sm:px-6 py-3">
          <a class="flex items-center gap-3 cursor-pointer select-none">
            <span
              class="size-10 rounded-full bg-white/[0.06] border border-white/10 flex items-center justify-center"
            >
              🤟
            </span>
            <div class="leading-tight">
              <div class="text-white font-black tracking-tight text-base sm:text-lg">ASL Kids</div>
              <div class="text-white/55 text-[11px] sm:text-xs">Learn & Play</div>
            </div>
          </a>

          <nav class="hidden md:flex items-center gap-2">
            <a
              routerLink="/home"
              class="group inline-flex items-center gap-2 rounded-full px-4 py-2 text-sm font-semibold text-white/80 hover:text-white transition"
            >
              <span
                class="size-8 rounded-full bg-white/[0.04] border border-white/10 flex items-center justify-center group-hover:bg-white/[0.07] transition"
              >
                <i class="fa-solid fa-house text-white/70"></i>
              </span>
              Home
            </a>

            <a
              class="group inline-flex items-center gap-2 rounded-full px-4 py-2 text-sm font-semibold text-white/80 hover:text-white transition cursor-pointer"
            >
              <span
                class="size-8 rounded-full bg-white/[0.04] border border-white/10 flex items-center justify-center group-hover:bg-white/[0.07] transition"
              >
                <i class="fa-solid fa-trophy text-white/70"></i>
              </span>
              Progress
            </a>
          </nav>

          <div class="flex items-center gap-2">
            <button
              type="button"
              (click)="goToProfile()"
              class="cursor-pointer inline-flex items-center gap-2 rounded-full border border-white/10 bg-white/[0.05] px-3 py-2 hover:bg-white/[0.08] transition"
            >
              <span
                class="size-8 rounded-full overflow-hidden bg-purple-600/80 border border-white/10 flex items-center justify-center"
              >
                @if (profileImage) {
                <img [src]="profileImage" class="w-full h-full object-cover" />
                } @else {
                <span class="text-sm font-black text-white">{{ firstLetter }}</span>
                }
              </span>
              <span class="hidden sm:block text-sm font-semibold text-white/85">Profile</span>
            </button>

            <button
              type="button"
              (click)="logOut()"
              class="cursor-pointer hidden sm:inline-flex items-center justify-center size-10 rounded-full border border-white/10 bg-white/[0.04] hover:bg-red-500/10 hover:border-red-500/30 transition"
              title="Log out"
            >
              <i class="fa-solid fa-arrow-right-from-bracket text-white/75 hover:text-red-200"></i>
            </button>

            <button
              type="button"
              (click)="toggleMenu()"
              class="cursor-pointer md:hidden inline-flex items-center justify-center size-10 rounded-full border border-white/10 bg-white/[0.05] hover:bg-white/[0.09] transition"
              [attr.aria-expanded]="isMenuOpen"
            >
              @if (!isMenuOpen) {
              <i class="fa-solid fa-ellipsis-vertical text-white/85"></i>
              } @else {
              <i class="fa-solid fa-xmark text-white/85"></i>
              }
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  @if (isMenuOpen) {
  <div class="fixed inset-0 z-50" (click)="isMenuOpen = false">
    <div class="absolute inset-0 bg-black/60"></div>

    <div class="absolute inset-x-0 bottom-0 p-4" (click)="$event.stopPropagation()">
      <div
        class="rounded-[28px] border border-white/10 bg-[#070A13]/92 backdrop-blur-xl shadow-[0_-20px_120px_-70px_rgba(0,0,0,.95)] overflow-hidden"
      >
        <div class="px-5 py-4 flex items-center justify-between border-b border-white/10">
          <div class="text-white font-bold">Menu</div>
          <button
            type="button"
            class="size-10 rounded-2xl border border-white/10 bg-white/[0.04] hover:bg-white/[0.08] transition"
            (click)="isMenuOpen = false"
          >
            <i class="fa-solid fa-xmark text-white/75"></i>
          </button>
        </div>

        <div class="p-4 grid gap-3">
          <a
            routerLink="/home"
            (click)="isMenuOpen = false"
            class="flex items-center justify-between rounded-2xl border border-white/10 bg-white/[0.04] px-4 py-3 text-white/85"
          >
            <span class="inline-flex items-center gap-2">
              <i class="fa-solid fa-house text-white/60"></i> Home
            </span>
            <i class="fa-solid fa-chevron-right text-white/30 text-xs"></i>
          </a>

          <a
            (click)="isMenuOpen = false"
            class="flex items-center justify-between rounded-2xl border border-white/10 bg-white/[0.04] px-4 py-3 text-white/85 cursor-pointer"
          >
            <span class="inline-flex items-center gap-2">
              <i class="fa-solid fa-trophy text-white/60"></i> Progress
            </span>
            <i class="fa-solid fa-chevron-right text-white/30 text-xs"></i>
          </a>

          <button
            type="button"
            (click)="logOut(); isMenuOpen = false"
            class="cursor-pointer w-full flex items-center justify-between rounded-2xl border border-red-500/25 bg-red-500/10 px-4 py-3 text-red-100"
          >
            <span class="inline-flex items-center gap-2">
              <i class="fa-solid fa-arrow-right-from-bracket"></i> Log out
            </span>
            <i class="fa-solid fa-chevron-right text-white/30 text-xs"></i>
          </button>
        </div>
      </div>
    </div>
  </div>
  }
</header>
