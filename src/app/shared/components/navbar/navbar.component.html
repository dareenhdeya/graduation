<header class="fixed top-0 left-0 right-0 z-50 transition-colors duration-300">
  <div class="mx-auto max-w-6xl px-4 pt-4">
    <div
      class="relative rounded-[999px] p-[1px] bg-gradient-to-r from-primary via-fuchsia-500/60 to-primary"
    >
      <div
        class="rounded-[999px] bg-white/80 dark:bg-[#070A13]/85 backdrop-blur-xl border border-border-main shadow-[0_25px_100px_-70px_rgba(0,0,0,.15)] dark:shadow-[0_25px_100px_-70px_rgba(0,0,0,.95)] transition-colors duration-300"
      >
        <div class="flex items-center justify-between px-4 sm:px-6 py-3">
          <a class="flex items-center gap-3 cursor-pointer select-none">
            <span
              class="size-10 rounded-full bg-text-main/5 border border-border-main flex items-center justify-center"
            >
              🤟
            </span>
            <div class="leading-tight">
              <div class="text-text-main font-black tracking-tight text-base sm:text-lg">
                ASL Kids
              </div>
              <div class="text-text-main/55 text-[11px] sm:text-xs">Learn & Play</div>
            </div>
          </a>

          <nav class="hidden md:flex items-center gap-2">
            <a
              routerLink="/home"
              class="group inline-flex items-center gap-2 rounded-full px-4 py-2 text-sm font-semibold text-text-main/80 hover:text-text-main transition"
            >
              <span
                class="size-8 rounded-full bg-text-main/5 border border-border-main flex items-center justify-center group-hover:bg-text-main/10 transition"
              >
                <i class="fa-solid fa-house text-text-main/70"></i>
              </span>
              Home
            </a>

            <a
              class="group inline-flex items-center gap-2 rounded-full px-4 py-2 text-sm font-semibold text-text-main/80 hover:text-text-main transition cursor-pointer"
            >
              <span
                class="size-8 rounded-full bg-text-main/5 border border-border-main flex items-center justify-center group-hover:bg-text-main/10 transition"
              >
                <i class="fa-solid fa-trophy text-text-main/70"></i>
              </span>
              Progress
            </a>
          </nav>

          <div class="flex items-center gap-2">
            <button
              (click)="themeService.toggleTheme()"
              class="flex items-center justify-center size-10 rounded-full bg-text-main/5 text-primary border border-border-main hover:bg-text-main/10 transition-all shadow-sm"
              title="Toggle Theme"
            >
              @if (themeService.isDarkMode$ | async) {
              <i class="fa-solid fa-sun text-lg"></i>
              } @else {
              <i class="fa-solid fa-moon text-lg"></i>
              }
            </button>

            <button
              type="button"
              (click)="goToProfile()"
              class="cursor-pointer inline-flex items-center gap-2 rounded-full border border-border-main bg-text-main/5 px-3 py-2 hover:bg-text-main/10 transition"
            >
              <span
                class="size-8 rounded-full overflow-hidden bg-primary border border-white/20 flex items-center justify-center"
              >
                @if (profileImage) {
                <img [src]="profileImage" class="w-full h-full object-cover" />
                } @else {
                <span class="text-sm font-black text-white">{{ firstLetter }}</span>
                }
              </span>
              <span class="hidden sm:block text-sm font-semibold text-text-main/85">Profile</span>
            </button>

            <button
              type="button"
              (click)="logOut()"
              class="cursor-pointer hidden sm:inline-flex items-center justify-center size-10 rounded-full border border-border-main bg-text-main/5 hover:bg-red-500/10 hover:border-red-500/30 hover:text-red-500 transition text-text-main/75"
              title="Log out"
            >
              <i class="fa-solid fa-arrow-right-from-bracket"></i>
            </button>

            <button
              type="button"
              (click)="toggleMenu()"
              class="cursor-pointer md:hidden inline-flex items-center justify-center size-10 rounded-full border border-border-main bg-text-main/5 hover:bg-text-main/10 transition text-text-main/85"
              [attr.aria-expanded]="isMenuOpen"
            >
              @if (!isMenuOpen) {
              <i class="fa-solid fa-ellipsis-vertical"></i>
              } @else {
              <i class="fa-solid fa-xmark"></i>
              }
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  @if (isMenuOpen) {
  <div class="fixed inset-0 z-50" (click)="isMenuOpen = false">
    <div class="absolute inset-0 bg-black/60 backdrop-blur-sm"></div>

    <div class="absolute inset-x-0 bottom-0 p-4" (click)="$event.stopPropagation()">
      <div
        class="rounded-[28px] border border-border-main bg-white/90 dark:bg-[#070A13]/92 backdrop-blur-xl shadow-[0_-20px_120px_-70px_rgba(0,0,0,.5)] dark:shadow-[0_-20px_120px_-70px_rgba(0,0,0,.95)] overflow-hidden transition-colors"
      >
        <div class="px-5 py-4 flex items-center justify-between border-b border-border-main">
          <div class="text-text-main font-bold">Menu</div>
          <button
            type="button"
            class="size-10 rounded-2xl border border-border-main bg-text-main/5 hover:bg-text-main/10 transition text-text-main/75"
            (click)="isMenuOpen = false"
          >
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>

        <div class="p-4 grid gap-3">
          <a
            routerLink="/home"
            (click)="isMenuOpen = false"
            class="flex items-center justify-between rounded-2xl border border-border-main bg-text-main/5 hover:bg-text-main/10 transition px-4 py-3 text-text-main/85"
          >
            <span class="inline-flex items-center gap-2">
              <i class="fa-solid fa-house text-text-main/60"></i> Home
            </span>
            <i class="fa-solid fa-chevron-right text-text-main/30 text-xs"></i>
          </a>

          <a
            (click)="isMenuOpen = false"
            class="flex items-center justify-between rounded-2xl border border-border-main bg-text-main/5 hover:bg-text-main/10 transition px-4 py-3 text-text-main/85 cursor-pointer"
          >
            <span class="inline-flex items-center gap-2">
              <i class="fa-solid fa-trophy text-text-main/60"></i> Progress
            </span>
            <i class="fa-solid fa-chevron-right text-text-main/30 text-xs"></i>
          </a>

          <button
            type="button"
            (click)="logOut(); isMenuOpen = false"
            class="cursor-pointer w-full flex items-center justify-between rounded-2xl border border-red-500/20 bg-red-500/10 hover:bg-red-500/20 transition px-4 py-3 text-red-600 dark:text-red-400 font-medium"
          >
            <span class="inline-flex items-center gap-2">
              <i class="fa-solid fa-arrow-right-from-bracket"></i> Log out
            </span>
            <i class="fa-solid fa-chevron-right text-red-500/50 text-xs"></i>
          </button>
        </div>
      </div>
    </div>
  </div>
  }
</header>
