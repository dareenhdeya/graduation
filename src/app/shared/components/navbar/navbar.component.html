<header
  class="fixed top-4 left-0 right-0 mx-auto w-[95%] max-w-6xl z-50 transition-all duration-300"
>
  <div
    class="bg-[#1a1b4b] rounded-3xl border border-blue-500/20 shadow-[0_0_20px_rgba(0,0,0,0.5)] overflow-hidden"
  >
    <div class="container mx-auto flex flex-wrap p-4 items-center justify-between">
      <a class="flex title-font font-medium items-center text-white cursor-pointer">
        <span class="text-3xl filter drop-shadow-[0_0_5px_rgba(255,255,255,0.5)]">🤟</span>
        <div class="flex flex-col px-3 items-start">
          <span class="text-xl font-bold tracking-wide text-white leading-none">ASL Kids</span>
          <span class="text-blue-200 text-xs tracking-wider uppercase">Learn & Play</span>
        </div>
      </a>

      <button
        (click)="toggleMenu()"
        class="md:hidden cursor-pointer inline-flex items-center justify-center p-2 w-10 h-10 text-white rounded-full hover:bg-white/10 focus:outline-none focus:ring-2 focus:ring-blue-500 transition-colors"
        aria-controls="navbar-default"
        [attr.aria-expanded]="isMenuOpen"
      >
        @if (!isMenuOpen) {
          <i class="fa-solid fa-bars text-xl"></i>
        } @else {
          <i class="fa-solid fa-xmark text-xl"></i>
        }
      </button>

      <div
        class="w-full md:w-auto md:flex items-center gap-4 mt-4 md:mt-0"
        [class.hidden]="!isMenuOpen"
        [class.block]="isMenuOpen"
      >
        <nav class="flex flex-col md:flex-row items-center gap-3 md:gap-4 w-full md:w-auto">
          <a
            routerLink="home"
            (click)="isMenuOpen = false"
            class="w-full md:w-auto group cursor-pointer"
          >
            <span
              class="flex items-center justify-center md:justify-start gap-2 bg-yellow-400 text-slate-900 font-bold px-6 py-3 md:py-2.5 rounded-xl md:rounded-full transition-all duration-300 hover:scale-[1.02] md:hover:scale-105 hover:shadow-[0_0_15px_rgba(250,204,21,0.6)]"
            >
              <i class="fa-solid fa-house"></i> Home
            </span>
          </a>

          <a (click)="isMenuOpen = false" class="w-full md:w-auto group cursor-pointer">
            <span
              class="flex items-center justify-center md:justify-start gap-2 bg-green-500 text-white font-bold px-6 py-3 md:py-2.5 rounded-xl md:rounded-full transition-all duration-300 hover:scale-[1.02] md:hover:scale-105 hover:shadow-[0_0_15px_rgba(34,197,94,0.6)]"
            >
              <i class="fa-solid fa-trophy"></i> Progress
            </span>
          </a>

          <div
            class="flex items-center justify-center gap-4 mt-2 md:mt-0 w-full md:w-auto border-t border-white/10 pt-4 md:border-0 md:pt-0 md:ml-2"
          >
            <button
              (click)="goToProfile(); isMenuOpen = false"
              class="relative group cursor-pointer hover:scale-110 transition-transform"
            >
              <span
                class="rounded-full overflow-hidden flex items-center justify-center bg-purple-600 w-11 h-11 text-white font-bold border-2 border-purple-400 shadow-[0_0_10px_rgba(168,85,247,0.5)]"
              >
                @if (profileImage) {
                  <img [src]="profileImage" class="w-full h-full object-cover" />
                } @else {
                  <span class="text-lg">{{ firstLetter }}</span>
                }
              </span>
            </button>

            <button
              (click)="logOut(); isMenuOpen = false"
              class="flex items-center gap-2 text-gray-300 hover:text-red-400 hover:bg-red-500/10 px-4 py-2 rounded-full transition-colors"
            >
              <i class="fa-solid fa-arrow-right-from-bracket"></i>
              <span class="font-semibold text-sm">Log Out</span>
            </button>
          </div>
        </nav>
      </div>
    </div>
  </div>
</header>
