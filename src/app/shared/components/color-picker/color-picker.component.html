<div
  class="fixed top-1/3 right-0 z-[100] flex transition-transform duration-500 ease-in-out"
  [class.translate-x-full]="!isOpen"
  [class.translate-x-0]="isOpen"
>
  <button
    (click)="togglePanel()"
    class="absolute -left-10 top-4 flex size-12 cursor-pointer items-center justify-center rounded-l-2xl border border-r-0 border-border-main bg-surface shadow-[-5px_5px_15px_rgba(0,0,0,0.1)] transition-colors hover:bg-text-main/5"
    aria-label="Toggle Theme Settings"
  >
    <i class="fa-solid fa-palette text-xl text-primary transition-transform duration-300 hover:scale-110 hover:-rotate-12"></i>
  </button>

  <div
    class="bg-surface/95 border border-r-0 border-border-main p-6 rounded-l-[2rem] shadow-2xl backdrop-blur-xl transition-colors duration-300 w-72"
  >
    <div class="flex items-center justify-between mb-6">
      <h3 class="text-text-main font-black text-lg">Theme 🎨</h3>
      <button 
        (click)="togglePanel()" 
        class="text-text-main/50 hover:text-red-500 transition-colors size-8 flex items-center justify-center rounded-full bg-text-main/5 hover:bg-red-500/10 cursor-pointer"
      >
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>

    <div class="flex flex-wrap items-center justify-center gap-4">
      @for (color of themeService.colors; track color.name) {
        <button
          (click)="themeService.setPrimaryColor(color.hex)"
          [style.backgroundColor]="color.hex"
          [class.scale-125]="(themeService.primaryColor$ | async) === color.hex"
          [class.ring-4]="(themeService.primaryColor$ | async) === color.hex"
          class="group relative size-10 rounded-full cursor-pointer transition-all duration-300 hover:scale-110 shadow-md ring-offset-2 ring-offset-background"
          [style.ringColor]="color.hex"
          [title]="color.name"
          [attr.aria-label]="'Select ' + color.name + ' theme'"
        >
          <div
            class="absolute inset-0 rounded-full bg-white/20 opacity-0 group-hover:opacity-100 transition-opacity"
          ></div>

          @if ((themeService.primaryColor$ | async) === color.hex) {
            <div class="absolute inset-0 flex items-center justify-center text-white drop-shadow-md">
              <i class="fa-solid fa-check text-sm"></i>
            </div>
          }
        </button>
      }
    </div>
  </div>
</div>

@if (isOpen) {
  <div 
    class="fixed inset-0 z-[90] bg-black/20  transition-opacity cursor-pointer"
    (click)="togglePanel()"
  ></div>
}
