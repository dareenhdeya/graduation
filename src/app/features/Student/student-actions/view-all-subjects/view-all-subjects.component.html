<section class="relative min-h-screen pt-28 pb-10 px-4 overflow-hidden transition-colors duration-300">
  <div class="container mx-auto max-w-7xl relative z-10">
    
    <div class="text-center mb-16">
      <h1 class="text-3xl md:text-5xl font-black text-text-main tracking-tight mb-4">
        Discover New
        <span class="text-transparent bg-clip-text bg-gradient-to-r from-primary to-purple-400"
          >Adventures</span
        >
      </h1>
      <p class="text-text-main/50 text-lg font-medium">Find your next favorite class and start learning today!</p>
    </div>

    @if (isLoading) {
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8">
      @for (item of [1, 2, 3, 4]; track item) {
      <div class="rounded-[2.5rem] border border-border-main bg-text-main/5 h-80 animate-pulse"></div>
      }
    </div>

    } @else {
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8">
      @for (sub of allSub; track sub.subjectId; let i = $index) {
      
      <div
        class="group relative flex flex-col items-center text-center rounded-[2.5rem] border-2 dark:border shadow-sm border-border-main bg-surface p-8 transition-all duration-500 hover:-translate-y-3 hover:border-primary/40 hover:shadow-2xl hover:shadow-primary/20 overflow-hidden"
      >
        <div class="absolute inset-0 bg-gradient-to-b from-transparent to-primary/5 opacity-0 group-hover:opacity-100 transition-opacity duration-500"></div>

        <div
          [class]="
            'relative z-10 size-24 rounded-[2rem] flex items-center justify-center text-4xl shadow-lg border border-border-main mb-6 transition-transform duration-500 group-hover:scale-110 group-hover:-rotate-3 ' +
            getBgColor(i) +
            ' ' +
            getColor(i)
          "
        >
          <i class="fa-solid fa-star"></i> </div>

        <h2 class="relative z-10 text-2xl font-black text-text-main mb-3 group-hover:text-primary transition-colors line-clamp-2">
          {{ sub.subjectName }}
        </h2>

        @if (sub.deaf_mute) {
        <span
          class="relative z-10 inline-flex items-center gap-1.5 px-4 py-1.5 rounded-full bg-pink-500/10 text-pink-600 dark:text-pink-400 text-[11px] font-black border border-pink-500/20 uppercase tracking-widest mb-6"
        >
          <i class="fa-solid fa-hands-asl-interpreting"></i> Accessible
        </span>
        } @else {
          <div class="mb-6 h-7"></div> 
        }

        <div class="relative z-10 mt-auto w-full pt-4">
          <button
            (click)="enrollSub(sub.subjectId)"
            class="w-full flex items-center justify-center gap-2 cursor-pointer bg-text-main text-background px-6 py-4 rounded-2xl font-black text-sm uppercase tracking-wide hover:bg-primary hover:text-white transition-all duration-300 shadow-lg shadow-text-main/10 hover:shadow-primary/30 active:scale-95"
          >
            <i class="fa-solid fa-bolt text-yellow-400 group-hover:text-white transition-colors"></i> 
            Enroll Now
          </button>
        </div>
      </div>
      }
    </div>
    }
  </div>
</section>
