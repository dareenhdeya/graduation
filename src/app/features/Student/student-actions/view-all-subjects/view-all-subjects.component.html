<section class="relative min-h-screen pt-28 pb-10 px-4 overflow-hidden">
  <div
    class="pointer-events-none absolute top-20 left-10 h-96 w-96 rounded-full bg-blue-600/10 blur-[100px]"
  ></div>
  <div
    class="pointer-events-none absolute bottom-20 right-10 h-96 w-96 rounded-full bg-purple-600/10 blur-[100px]"
  ></div>

  <div class="container mx-auto max-w-7xl relative z-10">
    <div class="text-center mb-12">
      <h1 class="text-3xl md:text-5xl font-black text-white tracking-tight mb-3">
        Explore
        <span class="text-transparent bg-clip-text bg-gradient-to-r from-sky-400 to-purple-400"
          >Subjects</span
        >
      </h1>
      <p class="text-white/50 text-lg">Select a subject to view details and stats</p>
    </div>

    @if (isLoading) {
      <div class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-4 gap-6">
        @for (item of [1, 2, 3, 4]; track item) {
          <div class="rounded-3xl border border-white/5 bg-white/[0.02] h-60 animate-pulse"></div>
        }
      </div>

    } @else {
      <div class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-4 gap-6">
        @for (sub of allSub; track sub.subjectId; let i = $index) {
          <a
            [routerLink]="['/student/subject', sub.subjectId]"
            class="group relative flex flex-col items-center justify-center text-center rounded-3xl border border-white/10 bg-white/5 p-8 transition-all duration-300 hover:-translate-y-2 hover:bg-white/[0.08] hover:border-sky-500/30 hover:shadow-2xl hover:shadow-sky-900/20 cursor-pointer"
          >
            <div
              [class]="
                'size-20 rounded-2xl flex items-center justify-center text-3xl shadow-lg border border-white/10 mb-6 transition-transform duration-300 group-hover:scale-110 ' +
                getBgColor(i) +
                ' ' +
                getColor(i)
              "
            >
              <i class="fa-solid fa-graduation-cap"></i>
            </div>

            <h2
              class="text-xl font-bold text-white mb-2 group-hover:text-sky-300 transition-colors"
            >
              {{ sub.subjectName }}
            </h2>

            @if (sub.deaf_mute) {
              <span
                class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-pink-500/10 text-pink-400 text-xs font-bold border border-pink-500/20 uppercase tracking-wider mb-4"
              >
                <i class="fa-solid fa-hands-asl-interpreting"></i> Accessible
              </span>
            }

            <div
              class="mt-auto opacity-0 transform translate-y-2 group-hover:opacity-100 group-hover:translate-y-0 transition-all duration-300"
            >
              <span class="text-sky-400 text-sm font-semibold flex items-center gap-2">
                View Details <i class="fa-solid fa-arrow-right"></i>
              </span>
            </div>
          </a>
        }
      </div>
    }
  </div>
</section>
