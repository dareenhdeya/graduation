<section class="relative py-10 px-4 transition-colors duration-300">
  <div class="container mx-auto max-w-6xl relative z-10">
    <div class="mb-12 text-center md:text-left">
      <h1 class="text-4xl md:text-5xl font-black text-text-main tracking-tight mb-2">
        Parent
        <span class="text-transparent bg-clip-text bg-gradient-to-r from-primary to-purple-400">
          Dashboard
        </span>
      </h1>

      <p class="text-text-main/60 text-lg">
        Manage your children's accounts and view their progress.
      </p>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <a
        routerLink="/parent/view-children"
        class="group relative overflow-hidden rounded-3xl border border-border-main bg-surface/40 backdrop-blur-xl p-8 transition-all duration-300 hover:-translate-y-2 hover:border-primary/40 hover:shadow-lg"
      >
        <div
          class="absolute -right-10 -top-10 h-40 w-40 rounded-full bg-primary/10 blur-2xl group-hover:bg-primary/20 transition"
        ></div>

        <div class="relative z-10">
          <div
            class="w-14 h-14 rounded-2xl bg-primary/10 text-primary flex items-center justify-center text-2xl mb-6 border border-primary/20 shadow-inner"
          >
            <i class="fa-solid fa-users-line"></i>
          </div>

          <h3 class="text-2xl font-bold text-text-main mb-2">My Children</h3>

          <p class="text-text-main/60 text-sm">
            View profiles, check activity, and manage settings for your kids.
          </p>

          <div
            class="mt-6 flex items-center gap-2 text-primary font-semibold text-sm group-hover:gap-3 transition-all"
          >
            <span>View All</span>
            <i class="fa-solid fa-arrow-right"></i>
          </div>
        </div>
      </a>

      <a
        routerLink="/parent/register-student"
        class="group relative overflow-hidden rounded-3xl border border-border-main bg-surface/40 backdrop-blur-xl p-8 transition-all duration-300 hover:-translate-y-2 hover:border-primary/40 hover:shadow-lg"
      >
        <div
          class="absolute -right-10 -top-10 h-40 w-40 rounded-full bg-primary/10 blur-2xl group-hover:bg-primary/20 transition"
        ></div>

        <div class="relative z-10">
          <div
            class="w-14 h-14 rounded-2xl bg-primary/10 text-primary flex items-center justify-center text-2xl mb-6 border border-primary/20 shadow-inner"
          >
            <i class="fa-solid fa-user-plus"></i>
          </div>

          <h3 class="text-2xl font-bold text-text-main mb-2">Register Child</h3>

          <p class="text-text-main/60 text-sm">
            Create a new student account and link them to your profile.
          </p>

          <div
            class="mt-6 flex items-center gap-2 text-primary font-semibold text-sm group-hover:gap-3 transition-all"
          >
            <span>Add New</span>
            <i class="fa-solid fa-arrow-right"></i>
          </div>
        </div>
      </a>
    </div>
  </div>
</section>
