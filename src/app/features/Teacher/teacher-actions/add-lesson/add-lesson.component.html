<section class="relative min-h-screen overflow-hidden flex items-center justify-center py-10">
  <div class="relative z-10 w-full px-4">
    <div class="mx-auto w-full max-w-2xl">
      <div
        class="relative rounded-3xl border border-border-main bg-surface backdrop-blur-md shadow-sm px-6 md:px-8 py-10 flex flex-col transition-all duration-300 hover:-translate-y-1 hover:border-primary/40"
      >
        <div class="text-center mb-8">
          <div
            class="inline-flex flex items-center justify-center size-16 rounded-2xl bg-sky-500/10 text-sky-500 mb-4 border border-sky-500/20 shadow-sm"
          >
            <i class="fa-solid fa-clapperboard text-2xl"></i>
          </div>
          <h1 class="text-3xl md:text-4xl font-black tracking-tight text-text-main">
            Create New Lesson
          </h1>
          <p class="text-text-main/50 text-sm mt-2 font-bold">
            Add a lesson title now. You can upload videos and edit details later.
          </p>
        </div>

        <form [formGroup]="lessonForm" (ngSubmit)="onSubmit()" class="space-y-6">
          <div>
            <label
              class="block text-xs font-bold uppercase tracking-wider text-text-main/50 mb-2 pl-1"
              >Lesson Title</label
            >
            <input
              formControlName="title"
              type="text"
              class="w-full rounded-2xl border border-border-main bg-background px-4 py-3.5 text-sm font-semibold text-text-main outline-none transition-all focus:border-primary focus:ring-4 focus:ring-primary/10 shadow-sm placeholder:text-text-main/30"
              placeholder="e.g., Learn ABCs in ASL"
            />
            @if (lessonForm.get('title')?.touched && lessonForm.get('title')?.invalid) {
              <p class="text-red-500 text-xs font-bold mt-1 pl-1">
                Title is required (min 3 characters).
              </p>
            }
          </div>

          <div class="pt-4 border-t border-border-main">
            <button
              type="submit"
              [disabled]="lessonForm.invalid || isLoading"
              class="w-full h-12 cursor-pointer rounded-2xl bg-sky-500 font-bold text-white shadow-sm hover:bg-sky-600 hover:scale-[1.02] active:scale-[0.98] transition-all disabled:opacity-60 disabled:cursor-not-allowed disabled:hover:scale-100"
            >
              <span class="flex items-center justify-center gap-2">
                @if (isLoading) {
                  <i class="fas fa-spinner fa-spin"></i> Creating...
                } @else {
                  <i class="fa-solid fa-paper-plane"></i> Create Lesson
                }
              </span>
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</section>
